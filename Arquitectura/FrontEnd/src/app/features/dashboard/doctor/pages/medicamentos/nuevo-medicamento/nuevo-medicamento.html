<app-doctor-menu></app-doctor-menu>

<div class="toast-container" *ngIf="notifications.length > 0">
    <div *ngFor="let notif of notifications; let i = index" class="toast-notification toast-{{ notif.type }}"
        [class.toast-exit]="i > 0">
        <div class="toast-icon">
            <i class="bi" [class]="
                notif.type === 'success' ? 'bi-check-circle-fill' :
                notif.type === 'error' ? 'bi-x-circle-fill' :
                notif.type === 'warning' ? 'bi-exclamation-triangle-fill' :
                'bi-info-circle-fill'
            "></i>
        </div>
        <div class="toast-content">
            <div class="toast-title">{{ notif.title }}</div>
            <div class="toast-message">{{ notif.message }}</div>
        </div>
        <button class="toast-close" (click)="removeToast(notif.id)">
            <i class="bi bi-x-lg"></i>
        </button>
        <div class="toast-progress" [style.animation-duration]="(notif.duration || 5000) + 'ms'"></div>
    </div>
</div>

<div class="nuevo-medicamento-container">
    <div class="back-section">
        <button class="btn-back" (click)="cancelar()">
            <i class="bi bi-arrow-left"></i>
            <span>Volver a medicamentos</span>
        </button>
    </div>

    <div class="nuevo-medicamento-card">
        <div class="card-header">
            <div class="header-icon">
                <i class="bi bi-plus-circle"></i>
            </div>
            <div class="header-info">
                <h1>Nuevo Medicamento</h1>
                <p>Registra un nuevo medicamento en el catalogo</p>
            </div>
        </div>

        <form [formGroup]="medicamentoForm" (ngSubmit)="crearMedicamento()" class="nuevo-medicamento-form">
            <div class="form-grid">
                <div class="form-group">
                    <label for="nombreComercial">
                        Nombre Comercial <span class="required">*</span>
                    </label>
                    <input type="text" id="nombreComercial" formControlName="nombreComercial"
                        placeholder="Ej: Paracetamol" class="form-control"
                        [class.is-invalid]="medicamentoForm.get('nombreComercial')?.invalid && medicamentoForm.get('nombreComercial')?.touched" />
                    <div class="invalid-feedback"
                        *ngIf="medicamentoForm.get('nombreComercial')?.invalid && medicamentoForm.get('nombreComercial')?.touched">
                        El nombre comercial es obligatorio y debe tener al menos 2 caracteres.
                    </div>
                </div>

                <div class="form-group">
                    <label for="sustanciaActiva">
                        Sustancia Activa
                    </label>
                    <input type="text" id="sustanciaActiva" formControlName="sustanciaActiva"
                        placeholder="Ej: Acetaminofen" class="form-control" />
                </div>

                <div class="form-group">
                    <label for="presentacion">
                        Presentacion <span class="required">*</span>
                    </label>
                    <input type="text" id="presentacion" formControlName="presentacion"
                        placeholder="Ej: Tabletas 500 mg" class="form-control"
                        [class.is-invalid]="medicamentoForm.get('presentacion')?.invalid && medicamentoForm.get('presentacion')?.touched" />
                    <div class="invalid-feedback"
                        *ngIf="medicamentoForm.get('presentacion')?.invalid && medicamentoForm.get('presentacion')?.touched">
                        La presentacion es obligatoria.
                    </div>
                </div>

                <div class="form-group">
                    <label for="concentracion">
                        Concentracion
                    </label>
                    <input type="text" id="concentracion" formControlName="concentracion" placeholder="Ej: 500 mg"
                        class="form-control" />
                </div>

                <div class="form-group">
                    <label for="laboratorio">
                        Laboratorio
                    </label>
                    <input type="text" id="laboratorio" formControlName="laboratorio" placeholder="Ej: Bayer"
                        class="form-control" />
                </div>

                <div class="form-group full-width">
                    <label for="indicacionesGenerales">
                        Indicaciones Generales
                    </label>
                    <textarea id="indicacionesGenerales" formControlName="indicacionesGenerales"
                        placeholder="Indicaciones adicionales del medicamento..." class="form-control"
                        rows="4"></textarea>
                </div>
            </div>

            <div class="form-actions">
                <button type="button" class="btn-cancelar" (click)="cancelar()">
                    <i class="bi bi-x-lg"></i>
                    Cancelar
                </button>
                <button type="submit" class="btn-guardar" [disabled]="isLoading || medicamentoForm.invalid">
                    <span class="spinner-small" *ngIf="isLoading"></span>
                    <i class="bi bi-check-lg" *ngIf="!isLoading"></i>
                    {{ isLoading ? 'Guardando...' : 'Guardar Medicamento' }}
                </button>
            </div>
        </form>
    </div>
</div>
